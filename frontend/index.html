<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net-Worker</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/views.css">
</head>
<body>

<!-- ==========================================
     LOGIN WALL: pick a role, then sign in
     ========================================== -->
<div id="login-wall" class="login-wall hidden">
    <div class="login-card">
        <div class="brand"><span class="brand-mark">N</span>Net-Worker</div>
        <div>
            <h1>Internal project marketplace</h1>
            <p class="muted">Find your next project, or staff yours.</p>
        </div>

        <div id="role-options" class="role-options">
            <button type="button" class="role-option" data-role-option="employee">
                <span class="role-icon" data-icon="search"></span>
                <span><strong>Employee</strong><small>Find projects that fit your skills and apply</small></span>
            </button>
            <button type="button" class="role-option" data-role-option="manager">
                <span class="role-icon" data-icon="briefcase"></span>
                <span><strong>Project Manager</strong><small>Post projects and review applicants</small></span>
            </button>
        </div>

        <form id="login-form" class="stacked-form hidden">
            <h2 id="login-role-label"></h2>
            <label>Work email <input id="login-email" type="email" required autocomplete="username"></label>
            <label>Password <input id="login-password" type="password" required autocomplete="current-password"></label>
            <p id="login-hint" class="hint"></p>
            <button type="submit" class="button primary">Sign in</button>
            <button type="button" id="login-back" class="button ghost">Back to options</button>
        </form>

        <p id="login-status" class="status-text" role="status"></p>
    </div>
</div>

<!-- ==========================================
     APP SHELL: left rail (pages for this role) + main area
     ========================================== -->
<div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
        <div class="brand"><span class="brand-mark">N</span>Net-Worker</div>
        <nav id="dashboard-nav" class="nav" aria-label="Pages"></nav>
        <div class="sidebar-footer">
            <div class="user-chip">
                <span id="user-avatar" class="avatar"></span>
                <span><strong id="user-name"></strong><span id="user-role" class="role-badge"></span></span>
            </div>
            <button type="button" id="theme-toggle" class="button ghost small">Dark mode</button>
            <button type="button" id="logout-button" class="button secondary small">Sign out</button>
        </div>
    </aside>
    <main id="dashboard-root" class="main"></main>
</div>

<!-- Details drawer (listing details, apply form) -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-panel">
        <button type="button" id="modal-close" class="icon-button modal-close" aria-label="Close">&times;</button>
        <div id="modal-body"></div>
    </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- Order matters: shared code first, then the two dashboards, then the router. -->
<script src="js/core/api.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/components.js"></script>
<script src="js/views/employee.js"></script>
<script src="js/views/manager.js"></script>
<script src="js/views/review.js"></script>
<script src="js/views/activity.js"></script>
<script src="js/app.js"></script>
</body>
</html>

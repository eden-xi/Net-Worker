# Render blueprint: one free web service built from deploy/Dockerfile.
# Not used yet (the service was set up by hand in the dashboard).
# To use it later, point Render's Blueprint at this file: deploy/render.yaml
services:
  - type: web
    name: net-worker
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_USERNAME
        value: team
      - key: APP_PASSWORD
        sync: false   # Render asks you for this; it's never stored in git
    # Keep data across restarts (Move 4). Persistent disks need a paid instance type.
    # The app already stores everything in DATA_DIR=/data, so mounting a disk there is all it takes.
    # disk:
    #   name: networker-data
    #   mountPath: /data
    #   sizeGB: 1
